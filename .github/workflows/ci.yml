# Pull request checks. Every job must pass before a PR can be merged into main.
# Third-party actions are pinned to full commit SHAs (see SEC-09): a moved tag cannot change what runs here.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: CI never writes to the repo or publishes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.14.1
  TFLINT_VERSION: v0.66.0
  SYFT_VERSION: v1.57.2
  GRYPE_VERSION: v0.122.1
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  iac-lint:
    name: Terraform fmt, validate and tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/modules/traccar-stack infra/environments; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --chdir infra --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  iac-security:
    name: Checkov (Terraform and Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v12.3147.0
        with:
          directory: .
          framework: terraform,dockerfile
          output_format: cli
          quiet: true
          soft_fail: false

  dockerfile-lint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: images/traccar/Dockerfile
          failure-threshold: warning

  image-scan:
    name: Build, SBOM (Syft) and vulnerability scan (Grype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/traccar
          load: true
          push: false
          tags: avl/traccar:ci-${{ github.sha }}

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # One catalog pass, two formats: syft-json feeds Grype, CycloneDX is the shareable SBOM.
      - name: Generate SBOM
        run: |
          "${{ steps.syft.outputs.cmd }}" scan "docker:avl/traccar:ci-${{ github.sha }}" \
            -o syft-json=sbom.syft.json \
            -o cyclonedx-json=sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.*.json
          retention-days: 30

      # Fails on HIGH or CRITICAL only when a fixed version exists.
      - name: Scan SBOM with Grype
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          sbom: sbom.syft.json
          grype-version: ${{ env.GRYPE_VERSION }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Official release binary, verified against a pinned SHA-256 before it runs.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan git history
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .
