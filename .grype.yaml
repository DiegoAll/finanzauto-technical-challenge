# Grype accepted risks (provisional policy, see DD-25 in the design decisions).
# Only HIGH/CRITICAL findings with a fix fail the build. Each entry below is a finding
# that only the Traccar project can fix. OS packages are patched in the Dockerfile instead.
# Rules match one vulnerability on one package: new CVEs on the same package still fail.
ignore:
  - vulnerability: CVE-2026-114938
    package:
      name: openjdk
      type: binary
    reason: "Upstream traccar/traccar:6.17.0 (latest release) bundles this JRE (jlink from eclipse-temurin:25); no Traccar release ships the fix yet. Tracked by Dependabot on the base image. Review by 2026-12-31. Highest priority (EPSS): rebuilding the JRE is the planned mitigation."
